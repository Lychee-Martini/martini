[package]
name = "martini-cli"
version = "0.1.2"
edition = "2024"
authors = ["Lychee Martini <info@lycheemartini.com>"]
description = "A modern, extensible CLI format converter built in Rust and optimized for Agent Skills."
readme = "README.md"
license = "Apache-2.0"
homepage = "https://lycheemartini.com"
repository = "https://github.com/Lychee-Martini/martini"
documentation = "https://github.com/Lychee-Martini/martini"
keywords = ["converter", "image", "pdf", "markdown", "agent-skill"]
categories = ["command-line-utilities", "multimedia::images"]


[lib]
name = "martini"
path = "src/lib.rs"

[[bin]]
name = "martini"
path = "src/main.rs"

[dependencies]
# CLI Parsing
clap = { version = "4.6.7", features = ["derive", "env"] }

# Graphics and Formats
resvg = "0.49.0"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "tiff",
    "qoi",
] }

ico = "0.6.0"
ravif = { version = "0.13.0", default-features = false }
webp = "0.3.1"
pdfium-render = { version = "0.9.4", features = ["image_025"] }
pdfium-auto = "0.3.1"

# Concurrency & Progress
rayon = "1.12.0"
indicatif = { version = "0.18.6", features = ["rayon"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "=1.1.8"
csv = "1.4.0"

# Archives and Compression
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.10"
tempfile = "3.27.0"
sha2 = "0.10"
dirs = "6.0"
# File watching
notify = "8.2.0"


# Error handling and logs
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
glob = "0.3"

# Markdown, Typst, and Word
docx-rs = "0.4.22"
pulldown-cmark = "0.13.5"
typst = "0.15.1"
typst-pdf = "0.15.1"
fontdb = "0.24"


[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1"

[profile.dev]
debug = 1

[profile.test]
debug = 1


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.deb]
name = "martini"
maintainer = "Lychee Martini <info@lycheemartini.com>"
copyright = "2026, Lychee Martini <info@lycheemartini.com>"
license-file = ["LICENSE", "4"]
extended-description = """\
A modern, extensible CLI format converter built in Rust and optimized for Agent Skills. \
Supports images (PNG, JPEG, WebP, AVIF, SVG, ICO), PDF to images, and Markdown to PDF/DOCX.\
"""
section = "utils"
priority = "optional"
assets = [
    [
        "target/release/martini",
        "usr/bin/martini",
        "755",
    ],
    [
        "README.md",
        "usr/share/doc/martini/README.md",
        "644",
    ],
    [
        "LICENSE",
        "usr/share/doc/martini/copyright",
        "644",
    ],
]

[package.metadata.generate-rpm]
name = "martini"
summary = "A modern, extensible CLI format converter built in Rust and optimized for Agent Skills."
license = "Apache-2.0"
assets = [
    { source = "target/release/martini", dest = "/usr/bin/martini", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/martini/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/martini/LICENSE", mode = "644" },
]
